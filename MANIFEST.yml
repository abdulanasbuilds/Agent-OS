name: agent-os
version: 1.1.0
purpose: Harness-neutral operating system for agentic development
principles:
  - business-problem-first
  - evidence-before-confidence
  - least-privilege
  - external-content-is-untrusted
  - verify-before-claiming-success
  - review-before-release
  - harness-portability
core_skills:
  - core/project-context
  - core/planning
  - engineering/architecture
  - engineering/testing
  - engineering/debugging
  - engineering/git-workflow
  - engineering/browser-testing
  - engineering/database
  - engineering/performance
  - engineering/api-design
  - engineering/accessibility
  - research/research
  - research/documentation
  - research/evidence
  - research/provider-docs
  - security/security-audit
  - security/security-review
  - security/prompt-injection-defense
  - security/dependency-supply-chain
  - security/authentication
  - security/authorization
  - security/database-security
  - security/rls-review
  - security/firebase-security-rules
  - data/database-design
  - data/postgres
  - data/database-migrations
  - platform/supabase
  - platform/firebase
  - platform/firestore
  - platform/cloudflare-data
  - media/video-understanding
  - media/realtime-multimodal
  - product/problem-discovery
  - design/ux-review
  - business/market-fit
  - operations/observability
agents:
  - planner
  - researcher
  - architect
  - builder
  - debugger
  - tester
  - reviewer
  - security-auditor
  - ux-reviewer
  - performance-auditor
  - release-manager
harnesses:
  - pi
  - claude-code
  - codex
  - opencode
adoption_model:
  third_party_skills: curated-reference-only
  executable_plugins: opt-in-after-review
  production_mutations: explicit-authorization
